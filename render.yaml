services:
  - type: web
    name: muvpack-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: MUVPACK_SECRET_KEY
        generateValue: true
      - key: MUVPACK_DATABASE_URL
        fromDatabase:
          name: muvpack-db
          property: connectionString
      - key: MUVPACK_COOKIE_SECURE
        value: "1"
      - key: MUVPACK_SESSION_SAMESITE
        value: "none"
      - key: CORS_ORIGINS
        value: "https://muvpack-web.onrender.com"

  - type: web
    name: muvpack-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE
        value: "https://muvpack-api.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: muvpack-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
